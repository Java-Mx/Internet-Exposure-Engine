apiVersion: v1
kind: Namespace
metadata:
  name: aeris-prod
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aeris-config
  namespace: aeris-prod
data:
  DB_HOST: "mysql-service"
  DB_PORT: "3306"
  DB_NAME: "exposure_discovery"
---
apiVersion: v1
kind: Secret
metadata:
  name: aeris-secrets
  namespace: aeris-prod
type: Opaque
data:
  MYSQL_ROOT_PASSWORD: c2VjdXJlc3lzdGVtcGFzczIwMjY=  # Base64 for securesystempass2026
  AERIS_SIGNING_KEY: QUVSSVMtU1lTVEVNLVNFQ1JFTC1TRUNSRVQtUFJPRFVDVElPTi1LRVktODE4MjMxOTIz
---
# ──────────────────────────────────────────────────────────────────────────────
# DATABASE: MySQL StatefulSet & Headless Service
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: aeris-prod
spec:
  ports:
    - port: 3306
  selector:
    app: mysql
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: aeris-prod
spec:
  serviceName: "mysql-service"
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
              name: dbport
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aeris-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: "exposure_discovery"
          volumeMounts:
            - name: mysql-persistent-storage
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: mysql-persistent-storage
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 20Gi
---
# ──────────────────────────────────────────────────────────────────────────────
# BACKEND: FastAPI Portal Gateway Deployment & Service
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: portal-service
  namespace: aeris-prod
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: portal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-deployment
  namespace: aeris-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: portal
  template:
    metadata:
      labels:
        app: portal
    spec:
      containers:
        - name: portal
          image: aeris-registry/portal:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: aeris-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: aeris-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: aeris-config
                  key: DB_NAME
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aeris-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: AERIS_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: aeris-secrets
                  key: AERIS_SIGNING_KEY
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
# ──────────────────────────────────────────────────────────────────────────────
# FRONTEND: Streamlit UI Dashboard Deployment & Service
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: dashboard-service
  namespace: aeris-prod
spec:
  ports:
    - port: 8501
      targetPort: 8501
  selector:
    app: dashboard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-deployment
  namespace: aeris-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
        - name: dashboard
          image: aeris-registry/dashboard:latest
          ports:
            - containerPort: 8501
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
---
# ──────────────────────────────────────────────────────────────────────────────
# AUTOSCALING: Horizontal Pod Autoscaler for API Gateway
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: portal-hpa
  namespace: aeris-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: portal-deployment
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
---
# ──────────────────────────────────────────────────────────────────────────────
# INGRESS: Reverse Proxy Gateway Routes
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aeris-ingress
  namespace: aeris-prod
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  rules:
    - host: aeris.company.internal
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: portal-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard-service
                port:
                  number: 8501
