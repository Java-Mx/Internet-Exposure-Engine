# DEPRECATION NOTICE: The MySQL service below was used prior to the AERIS SQLite
# migration (2026-06-15). SQLite (records/data/aeris.db) is now the primary backend
# for local and development environments. The MySQL definitions remain for reference
# and potential production deployment planning only.
version: "3.8"

services:
  # 1. API Portal Gateway
  portal:
    build:
      context: .
      dockerfile: Dockerfile.portal
    container_name: aeris_portal
    ports:
      - "8000:8000"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_DATABASE=exposure_discovery
      - MYSQL_USER=root
      - MYSQL_PASSWORD=securesystempass2026
      - AERIS_SIGNING_KEY=AERIS-SYSTEM-SECRET-SECRET-PRODUCTION-KEY-818231923
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - db_data:/app/records/data
    restart: always

  # 2. Interactive UI Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: aeris_dashboard
    ports:
      - "8501:8501"
    environment:
      - SHODAN_API_KEY=${SHODAN_API_KEY}
      - CENSYS_API_ID=${CENSYS_API_ID}
      - CENSYS_API_SECRET=${CENSYS_API_SECRET}
    depends_on:
      - portal
    restart: always

  # 3. Production MySQL Backend (Threat Memory Cache & Escalations)
  mysql:
    image: mysql:8.0
    container_name: aeris_db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=securesystempass2026
      - MYSQL_DATABASE=exposure_discovery
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecuresystempass2026"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # 4. Prometheus Telemetry Aggregator
  prometheus:
    image: prom/prometheus:latest
    container_name: aeris_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      - portal
    restart: always

  # 5. Grafana Monitoring Panel
  grafana:
    image: grafana/grafana:latest
    container_name: aeris_grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: always

volumes:
  db_data:
  mysql_data:
  prometheus_data:
  grafana_data:
